site_name: EPE — Wawa Pacocha
site_description: Evaluación de Perfil de Egreso — Ingeniería de Sistemas (UPeU) — Sistema Wawa Pacocha
# Reemplaza LuisAlbertoQ por tu usuario de GitHub antes de desplegar:
site_url: https://LuisAlbertoQ.github.io/epe-wawa-pacocha/
use_directory_urls: false

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: green
      accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Inicio: index.md
  - Software:
      - Resumen: software/index.md
      - E1 · Definición del Sistema: software/e1.md
      - E2 · Base de Datos: software/e2.md
      - E3 · Sistema Integrado: software/e3.md
      - E4 · Gestión de Calidad: software/e4.md
      - Presentación: software/presentacion.md
      - Diagramas Mermaid: software/files/Diagramas_Mermaid.md
      - Recursos y archivos: software/recursos.md
  - Gestión de TI:
      - Resumen: gestion/index.md
      - E1 · Diagnóstico: gestion/e1.md
      - E2 · Business Case: gestion/e2.md
      - E3 · Plan de Gestión: gestion/e3.md
      - E4 · Modelado de Procesos: gestion/e4.md
      - E5 · Propuesta TIC Integrada: gestion/e5.md
  - Infraestructura:
      - Resumen: infraestructura/index.md
      - S1 E1 · Red: infraestructura/s1e1.md
      - S1 E2 · Centro de Datos: infraestructura/s1e2.md
      - S2 E1 · SGSI: infraestructura/s2e1.md
      - S2 E2 · Monitoreo de Red: infraestructura/s2e2.md
      - S2 E3 · Centro de Datos: infraestructura/s2e3.md
      - Recursos y archivos: infraestructura/recursos.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
